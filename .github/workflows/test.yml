# The suite, in the same container it runs in locally.
#
# "Same" is the whole point. Eighty-one x86-64 instructions are byte-verified
# against `gas` and the RISC-V gate reads our own output back through
# `riscv64-linux-gnu-objdump`; those tests compare us against a toolchain, so a
# different toolchain here and there would turn a version difference into what
# looks like a compiler bug. The image pins Chez, binutils, the RISC-V
# cross-binutils and qemu, so a green run means the same thing in both places.
#
# The job also carries the same containment. `timeout-minutes` is the CI
# equivalent of the ENTRYPOINT's `timeout`, and the container keeps its memory
# limit, so a runaway pass fails one job instead of wedging a runner.

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # WHICH ENGINE, SAID OUT LOUD.
    #
    # tools/container.sh picks podman when podman is installed, and GitHub's
    # ubuntu-latest has it -- so CI chose podman while the step above built the
    # image with `docker compose`, and podman then handed off to the
    # docker-compose plugin, which tried to reach a podman socket that is not
    # running:
    #
    #   Cannot connect to the Docker daemon at unix:///run/user/1001/podman/podman.sock
    #
    # Nothing started, for five days, and the containment gate reported passes
    # because its assertions were satisfied by nothing happening (D193). The
    # override existed the whole time; CI simply never set it.
    env:
      SONIC_COMPOSE: docker compose
      # SONIC_CPUS is no longer needed here: tools/container.sh computes it from
      # the host, capped at 8, so a four-core runner asks for four (D203). Left
      # unset deliberately -- pinning it would hide whether that works.

    steps:
      # v4 runs on node20, which GitHub deprecated and now force-runs on node24
      # -- an annotation on every green run and a failure once the shim goes.
      # v5 is the first major on node24; v6 and v7 exist and are also node24,
      # but v5 is the smallest step that answers the deprecation, and a checkout
      # action is not where this project wants to discover a behaviour change.
      - uses: actions/checkout@v5
        with:
          submodules: recursive        # sonic/vendor/nanopass

      - name: Build the toolchain image
        run: docker compose build

      # The limits come from docker-compose.yml, so they are the same numbers
      # the developer ran under. Nothing is duplicated here to drift. These are
      # also the SAME two commands a developer runs -- tools/container.sh picks
      # the engine (docker here, podman on Nathan's box), so local and CI are
      # one code path rather than two that resemble each other.
      - name: Containment gate
        run: ./tools/test-containment.sh

      - name: Run the suite
        run: make -C sonic test

      - name: RISC-V smoke gate
        run: ./harness/smoke-riscv.sh
